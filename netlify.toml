[build]
  command = "npm run build"
  publish = "dist"

# The ffmpeg core and the demo media are content-addressed by name and never
# change within a deploy, so they can be cached hard.
[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Note: no COOP/COEP headers. The single-thread ffmpeg core does not use
# SharedArrayBuffer, and setting cross-origin isolation here would only break
# the page's ability to be embedded or to load ordinary third-party resources.
